version: '3.8'
services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    container_name: go-wannacar-calculator
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /path/to/sqlite_data/wannacar-bot.db:/app/wannacar-bot.db:rw